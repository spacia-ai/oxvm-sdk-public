title = "OxideVM SDK secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Dummy PEM text that exercises PEM header validation in docker-context tests"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "match"
paths = ['''packages/sdk/src/image-builder/docker-context\.test\.ts$''']
regexes = ['''BEGIN PRIVATE KEY-----\\nprivate''']

[[allowlists]]
description = "Minified module resolver code passes its token option on as an identifier (token:a.token), not a literal secret"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''dist/image-builder/modules/resolve\.js$''']
regexes = ['''^[A-Za-z_$][A-Za-z0-9_$]*\.token,''']

[[allowlists]]
description = "Recorded Node 24.18.1 node:crypto control vectors. Each file embeds its recorder; the keys, key pairs and shared secrets in it were generated by that recorder for comparison and protect nothing"
targetRules = ["private-key", "generic-api-key"]
paths = ['''packages/sdk/src/runtime/workers/assistance/node-crypto-(cipher|dh|ecdh|keys|keygen|sign)\.controls\.json$''']

[[allowlists]]
description = "Recorded tls.createServer control vectors: the self-signed localhost and client identities the recorder generated for the comparison run"
targetRules = ["private-key"]
paths = ['''packages/sdk/src/runtime/workers/assistance/node-tls-server\.controls\.json$''']

[[allowlists]]
description = "Dummy encrypted-PEM text (one to three body bytes) that exercises PEM header parsing in the node:crypto tests"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "match"
paths = ['''packages/sdk/src/runtime/workers/assistance/node-crypto-(pem|keys)\.test\.ts$''']
regexes = ['''Proc-Type: 4,ENCRYPTED''']

[[allowlists]]
description = "The Sec-WebSocket-Key of RFC 6455 section 1.3's own example"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''packages/sdk/src/runtime/workers/assistance/node-websocket\.test\.ts$''']
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']
